plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin builds the Flutter module together with Android.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.shopkart"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // Unique id on the Play Store / device: com.example.shopkart
        applicationId = "com.example.shopkart"
        // You can raise minSdk if you need newer Android APIs.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: add your own signing config before publishing.
            // For now, release builds are signed with the debug key
            // so you can test `flutter run --release`.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
